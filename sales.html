<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Bán Hàng</title>
  <style>
/* ===== VARIABLES ===== */
:root {
  --primary: #e85d26;
  --primary-dark: #c44a1a;
  --primary-light: #fff0ea;
  --accent: #ffb347;
  --green: #22c55e;
  --red: #ef4444;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --bg: #faf8f5;
  --card: #ffffff;
  --text: #1a1410;
  --text2: #6b5e52;
  --border: #e8e0d8;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --font: 'Be Vietnam Pro', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
}

/* ===== LOGIN ===== */
.login-body { background: linear-gradient(135deg, #e85d26 0%, #ff8c42 50%, #ffb347 100%); }

.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-card {
  background: white;
  border-radius: 24px;
  padding: 40px 32px;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
  text-align: center;
}

.shop-logo { font-size: 56px; margin-bottom: 12px; }

.shop-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 6px;
}

.shop-title span { color: var(--primary); }
.shop-sub { color: var(--text2); font-size: 14px; margin-bottom: 32px; }

.form-group { text-align: left; margin-bottom: 16px; }

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 15px;
  transition: border-color .2s;
  outline: none;
}

.form-group input:focus { border-color: var(--primary); }

.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: background .2s, transform .1s;
}

.btn-login:hover { background: var(--primary-dark); }
.btn-login:active { transform: scale(.98); }

.err-msg { color: var(--red); font-size: 13px; margin-top: 10px; }

/* ===== LAYOUT ===== */
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }

.top-bar {
  background: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
}

.top-bar-left { display: flex; align-items: center; gap: 10px; }

.top-bar-logo { font-size: 24px; }

.top-bar-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
}

.top-bar-title span { color: var(--primary); }

.btn-logout {
  padding: 8px 14px;
  background: var(--primary-light);
  color: var(--primary);
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.page-content {
  flex: 1;
  padding: 20px 16px 100px;
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: white;
  border-top: 1px solid var(--border);
  display: flex;
  box-shadow: 0 -4px 20px rgba(0,0,0,.08);
  z-index: 100;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 4px 14px;
  cursor: pointer;
  text-decoration: none;
  color: var(--text2);
  transition: color .2s;
  border: none;
  background: none;
  font-family: var(--font);
}

.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 22px; margin-bottom: 2px; }
.nav-label { font-size: 10px; font-weight: 600; }

/* ===== CARDS ===== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.card-value {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
}

.card-value.green { color: var(--green); }
.card-value.red { color: var(--red); }
.card-value.blue { color: var(--blue); }
.card-value.orange { color: var(--primary); }

/* ===== KPIS GRID ===== */
.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.kpi-card {
  background: white;
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.kpi-icon { font-size: 28px; margin-bottom: 8px; }
.kpi-label { font-size: 12px; color: var(--text2); font-weight: 500; margin-bottom: 4px; }
.kpi-val { font-size: 20px; font-weight: 800; }

/* ===== SECTION HEADER ===== */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.section-title {
  font-size: 16px;
  font-weight: 700;
}

/* ===== BUTTONS ===== */
.btn {
  padding: 12px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s, transform .1s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--green); color: white; }
.btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn-full { width: 100%; justify-content: center; }
.btn-danger { background: var(--red); color: white; }

/* ===== FLOATING ADD BUTTON ===== */
.fab {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  border: none;
  font-size: 26px;
  box-shadow: 0 4px 20px rgba(232,93,38,.5);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s;
  z-index: 90;
}

.fab:hover { transform: scale(1.08); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}

.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: white;
  border-radius: 24px 24px 0 0;
  padding: 28px 20px 40px;
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.25,.46,.45,.94);
}

.modal-overlay.open .modal { transform: translateY(0); }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.modal-title { font-size: 18px; font-weight: 800; }

.btn-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg);
  border: none;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== FORM ===== */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }

.field input, .field select, .field textarea {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 15px;
  background: white;
  outline: none;
  transition: border-color .2s;
}

.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ===== LIST ITEMS ===== */
.list-item {
  background: white;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
}

.list-item:active { transform: scale(.98); }

.list-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.bg-orange { background: #fff0ea; }
.bg-green { background: #f0fdf4; }
.bg-blue { background: #eff6ff; }
.bg-red { background: #fef2f2; }
.bg-purple { background: #f5f3ff; }

.list-info { flex: 1; min-width: 0; }
.list-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

.list-right { text-align: right; flex-shrink: 0; }
.list-amount { font-weight: 700; font-size: 15px; }
.list-date { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* ===== TAGS ===== */
.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}

.tag-green { background: #dcfce7; color: #15803d; }
.tag-red { background: #fee2e2; color: #b91c1c; }
.tag-orange { background: #fff0ea; color: var(--primary); }
.tag-blue { background: #dbeafe; color: #1d4ed8; }

/* ===== SEARCH ===== */
.search-bar {
  display: flex;
  align-items: center;
  background: white;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  gap: 8px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.search-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-family: var(--font);
  font-size: 14px;
  background: transparent;
}

/* ===== EMPTY ===== */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text2);
}

.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; font-weight: 600; }
.empty-sub { font-size: 13px; margin-top: 4px; }

/* ===== DESKTOP ===== */
@media (min-width: 768px) {
  .page-content { padding: 28px 24px 100px; }
  .kpi-grid { grid-template-columns: repeat(4, 1fr); }
  .modal-overlay { align-items: center; }
  .modal { border-radius: 24px; max-height: 80vh; }
}

/* ===== UTILS ===== */
.text-right { text-align: right; }
.text-green { color: var(--green); }
.text-red { color: var(--red); }
.mt-16 { margin-top: 16px; }
.loading { text-align: center; padding: 32px; color: var(--text2); }

/* divider */
.divider { height: 1px; background: var(--border); margin: 16px 0; }

</style>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    .cart-bar { position:fixed; bottom:70px; left:0; right:0; background:var(--primary); color:white; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; z-index:90; display:none; }
    .cart-bar.show { display:flex; }
    .product-card { background:white; border-radius:12px; padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); }
    .qty-ctrl { display:flex; align-items:center; gap:8px; }
    .qty-btn { width:30px; height:30px; border-radius:8px; border:2px solid var(--border); background:white; font-size:18px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .qty-btn.plus { background:var(--primary); color:white; border-color:var(--primary); }
    .cart-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="top-bar">
    <div class="top-bar-left">
      <a href="/dashboard.html" style="text-decoration:none;font-size:22px;margin-right:4px;">←</a>
      <div class="top-bar-title">🛒 Bán Hàng</div>
    </div>
    <div style="font-size:13px;font-weight:600;color:var(--primary)" id="cartCount">Giỏ: 0</div>
  </div>

  <div class="page-content">
    <!-- Tìm sản phẩm -->
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Tìm sản phẩm để thêm vào đơn..."/>
    </div>

    <!-- Giỏ hàng hiện tại -->
    <div class="card" id="cartCard" style="display:none;">
      <div class="section-header">
        <div class="section-title">🛒 Đơn hàng</div>
        <button class="btn btn-sm" style="background:#fef2f2;color:var(--red);" id="btnClearCart">Xóa đơn</button>
      </div>
      <div id="cartItems"></div>
      <div class="divider"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <span style="font-weight:700;font-size:16px;">Tổng cộng:</span>
        <span style="font-weight:800;font-size:22px;color:var(--primary);" id="cartTotal">0đ</span>
      </div>

      <div class="field">
        <label>Tên khách hàng</label>
        <input type="text" id="fCustomer" placeholder="Khách lẻ (bỏ qua nếu không cần)"/>
      </div>
      <div class="field">
        <label>Thanh toán</label>
        <select id="fPayment">
          <option value="paid">✅ Đã thanh toán</option>
          <option value="debt">⏳ Ghi nợ</option>
        </select>
      </div>
      <div class="field">
        <label>Ghi chú</label>
        <input type="text" id="fNote" placeholder="Ghi chú thêm..."/>
      </div>
      <button class="btn btn-success btn-full" id="btnCheckout" style="font-size:16px;padding:16px;">
        ✅ Xác nhận bán
      </button>
    </div>

    <!-- Danh sách sản phẩm -->
    <div class="section-header">
      <div class="section-title">Chọn hàng để bán</div>
    </div>
    <div id="productList"><div class="loading">Đang tải...</div></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item" href="/dashboard.html"><span class="nav-icon">🏠</span><span class="nav-label">Tổng quan</span></a>
    <a class="nav-item active" href="/sales.html"><span class="nav-icon">🛒</span><span class="nav-label">Bán hàng</span></a>
    <a class="nav-item" href="/inventory.html"><span class="nav-icon">📦</span><span class="nav-label">Kho hàng</span></a>
    <a class="nav-item" href="/debt.html"><span class="nav-icon">📋</span><span class="nav-label">Công nợ</span></a>
    <a class="nav-item" href="/report.html"><span class="nav-icon">📊</span><span class="nav-label">Báo cáo</span></a>
  </nav>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, where, orderBy, limit, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCRgJ9qLFiwY-v6K9dvdgIZXnzPeIiwfDY",
    authDomain: "quan-ao-manager.firebaseapp.com",
    projectId: "quan-ao-manager",
    storageBucket: "quan-ao-manager.firebasestorage.app",
    messagingSenderId: "890329830315",
    appId: "1:890329830315:web:bae03b04ef3af43cd6f8ee"
  };

  function fmt(num) {
    if (!num && num !== 0) return "0";
    return Number(num).toLocaleString("vi-VN") + "đ";
  }
  function fmtNum(num) { return Number(num || 0).toLocaleString("vi-VN"); }
  function today() { return new Date().toISOString().split("T")[0]; }
  function fmtDate(dateStr) {
    if (!dateStr) return "";
    return new Date(dateStr).toLocaleDateString("vi-VN");
  }
  function fmtDateTime(ts) {
    if (!ts) return "";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString("vi-VN", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }
  function toast(msg, type="success") {
    const el = document.createElement("div");
    el.textContent = msg;
    el.style.cssText = `position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:${type==="success"?"#22c55e":"#ef4444"};color:white;padding:10px 20px;border-radius:20px;font-family:'Be Vietnam Pro',sans-serif;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
  function showModal(id) { document.getElementById(id).classList.add("open"); }
  function hideModal(id) { document.getElementById(id).classList.remove("open"); }


  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);
  onAuthStateChanged(auth, u => { if (!u) window.location.href = "../index.html"; });

  let products = [];
  let cart = {}; // { productId: { product, qty } }

  async function loadProducts() {
    const snap = await getDocs(query(collection(db,"inventory"), orderBy("name")));
    products = [];
    snap.forEach(d => products.push({ id: d.id, ...d.data() }));
    renderProducts();
  }

  function renderProducts() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const filtered = products.filter(p => p.name.toLowerCase().includes(search) && p.quantity > 0);
    const el = document.getElementById("productList");
    if (!filtered.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">Không tìm thấy sản phẩm</div></div>`;
      return;
    }
    el.innerHTML = filtered.map(p => `
      <div class="product-card">
        <div style="flex:1;">
          <div style="font-weight:700;">${p.name}</div>
          <div style="font-size:12px;color:var(--text2);">${p.category || ""} • Còn: ${p.quantity}</div>
          <div style="font-weight:800;color:var(--primary);margin-top:4px;">${fmt(p.sellPrice)}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
          <span style="font-weight:700;min-width:20px;text-align:center;" id="qtyDisplay_${p.id}">${cart[p.id]?.qty || 0}</span>
          <button class="qty-btn plus" onclick="changeQty('${p.id}',1)">+</button>
        </div>
      </div>
    `).join("");
  }

  window.changeQty = function(id, delta) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    const current = cart[id]?.qty || 0;
    const newQty = Math.max(0, Math.min(p.quantity, current + delta));
    if (newQty === 0) delete cart[id];
    else cart[id] = { product: p, qty: newQty };
    updateCartUI();
    // update display
    const disp = document.getElementById(`qtyDisplay_${id}`);
    if (disp) disp.textContent = newQty;
  };

  function updateCartUI() {
    const items = Object.values(cart);
    const count = items.reduce((s, x) => s + x.qty, 0);
    const total = items.reduce((s, x) => s + x.qty * x.product.sellPrice, 0);
    document.getElementById("cartCount").textContent = `Giỏ: ${count}`;
    document.getElementById("cartTotal").textContent = fmt(total);

    const cartCard = document.getElementById("cartCard");
    const cartItemsEl = document.getElementById("cartItems");

    if (items.length === 0) {
      cartCard.style.display = "none";
      return;
    }
    cartCard.style.display = "block";
    cartItemsEl.innerHTML = items.map(({ product: p, qty }) => `
      <div class="cart-item">
        <div>
          <div style="font-weight:600;">${p.name}</div>
          <div style="font-size:12px;color:var(--text2);">${fmt(p.sellPrice)} × ${qty}</div>
        </div>
        <div style="font-weight:700;">${fmt(p.sellPrice * qty)}</div>
      </div>
    `).join("");
  }

  document.getElementById("searchInput").addEventListener("input", renderProducts);

  document.getElementById("btnClearCart").addEventListener("click", () => {
    cart = {};
    updateCartUI();
    renderProducts();
  });

  document.getElementById("btnCheckout").addEventListener("click", async () => {
    const items = Object.values(cart);
    if (!items.length) { toast("Giỏ hàng trống!", "error"); return; }

    const total = items.reduce((s, x) => s + x.qty * x.product.sellPrice, 0);
    const paymentStatus = document.getElementById("fPayment").value;
    const customerName = document.getElementById("fCustomer").value.trim() || "Khách lẻ";

    try {
      // Create order
      const orderRef = await addDoc(collection(db,"orders"), {
        customerName,
        items: items.map(({ product: p, qty }) => ({ productId: p.id, name: p.name, qty, price: p.sellPrice, subtotal: p.sellPrice * qty })),
        total,
        paymentStatus,
        note: document.getElementById("fNote").value.trim(),
        date: today(),
        createdAt: serverTimestamp()
      });

      // Update inventory
      for (const { product: p, qty } of items) {
        await updateDoc(doc(db,"inventory",p.id), { quantity: increment(-qty) });
      }

      // If debt, create debt record
      if (paymentStatus === "debt" && customerName !== "Khách lẻ") {
        await addDoc(collection(db,"debts"), {
          customerName,
          amount: total,
          orderId: orderRef.id,
          status: "chua_thu",
          note: `Đơn hàng ngày ${today()}`,
          date: today(),
          createdAt: serverTimestamp()
        });
      }

      toast("✅ Bán hàng thành công!");
      cart = {};
      updateCartUI();
      await loadProducts();
      document.getElementById("fCustomer").value = "";
      document.getElementById("fNote").value = "";
    } catch(e) { toast("Lỗi: " + e.message, "error"); }
  });

  loadProducts();
</script>
</body>
</html>
