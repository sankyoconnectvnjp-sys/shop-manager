<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Công Nợ</title>
  <style>
/* ===== VARIABLES ===== */
:root {
  --primary: #e85d26;
  --primary-dark: #c44a1a;
  --primary-light: #fff0ea;
  --accent: #ffb347;
  --green: #22c55e;
  --red: #ef4444;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --bg: #faf8f5;
  --card: #ffffff;
  --text: #1a1410;
  --text2: #6b5e52;
  --border: #e8e0d8;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --font: 'Be Vietnam Pro', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
}

/* ===== LOGIN ===== */
.login-body { background: linear-gradient(135deg, #e85d26 0%, #ff8c42 50%, #ffb347 100%); }

.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-card {
  background: white;
  border-radius: 24px;
  padding: 40px 32px;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
  text-align: center;
}

.shop-logo { font-size: 56px; margin-bottom: 12px; }

.shop-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 6px;
}

.shop-title span { color: var(--primary); }
.shop-sub { color: var(--text2); font-size: 14px; margin-bottom: 32px; }

.form-group { text-align: left; margin-bottom: 16px; }

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 15px;
  transition: border-color .2s;
  outline: none;
}

.form-group input:focus { border-color: var(--primary); }

.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: background .2s, transform .1s;
}

.btn-login:hover { background: var(--primary-dark); }
.btn-login:active { transform: scale(.98); }

.err-msg { color: var(--red); font-size: 13px; margin-top: 10px; }

/* ===== LAYOUT ===== */
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }

.top-bar {
  background: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
}

.top-bar-left { display: flex; align-items: center; gap: 10px; }

.top-bar-logo { font-size: 24px; }

.top-bar-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
}

.top-bar-title span { color: var(--primary); }

.btn-logout {
  padding: 8px 14px;
  background: var(--primary-light);
  color: var(--primary);
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.page-content {
  flex: 1;
  padding: 20px 16px 100px;
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: white;
  border-top: 1px solid var(--border);
  display: flex;
  box-shadow: 0 -4px 20px rgba(0,0,0,.08);
  z-index: 100;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 4px 14px;
  cursor: pointer;
  text-decoration: none;
  color: var(--text2);
  transition: color .2s;
  border: none;
  background: none;
  font-family: var(--font);
}

.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 22px; margin-bottom: 2px; }
.nav-label { font-size: 10px; font-weight: 600; }

/* ===== CARDS ===== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.card-value {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
}

.card-value.green { color: var(--green); }
.card-value.red { color: var(--red); }
.card-value.blue { color: var(--blue); }
.card-value.orange { color: var(--primary); }

/* ===== KPIS GRID ===== */
.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.kpi-card {
  background: white;
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.kpi-icon { font-size: 28px; margin-bottom: 8px; }
.kpi-label { font-size: 12px; color: var(--text2); font-weight: 500; margin-bottom: 4px; }
.kpi-val { font-size: 20px; font-weight: 800; }

/* ===== SECTION HEADER ===== */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.section-title {
  font-size: 16px;
  font-weight: 700;
}

/* ===== BUTTONS ===== */
.btn {
  padding: 12px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s, transform .1s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--green); color: white; }
.btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn-full { width: 100%; justify-content: center; }
.btn-danger { background: var(--red); color: white; }

/* ===== FLOATING ADD BUTTON ===== */
.fab {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  border: none;
  font-size: 26px;
  box-shadow: 0 4px 20px rgba(232,93,38,.5);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s;
  z-index: 90;
}

.fab:hover { transform: scale(1.08); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}

.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: white;
  border-radius: 24px 24px 0 0;
  padding: 28px 20px 40px;
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.25,.46,.45,.94);
}

.modal-overlay.open .modal { transform: translateY(0); }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.modal-title { font-size: 18px; font-weight: 800; }

.btn-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg);
  border: none;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== FORM ===== */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }

.field input, .field select, .field textarea {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 15px;
  background: white;
  outline: none;
  transition: border-color .2s;
}

.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ===== LIST ITEMS ===== */
.list-item {
  background: white;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
}

.list-item:active { transform: scale(.98); }

.list-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.bg-orange { background: #fff0ea; }
.bg-green { background: #f0fdf4; }
.bg-blue { background: #eff6ff; }
.bg-red { background: #fef2f2; }
.bg-purple { background: #f5f3ff; }

.list-info { flex: 1; min-width: 0; }
.list-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

.list-right { text-align: right; flex-shrink: 0; }
.list-amount { font-weight: 700; font-size: 15px; }
.list-date { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* ===== TAGS ===== */
.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}

.tag-green { background: #dcfce7; color: #15803d; }
.tag-red { background: #fee2e2; color: #b91c1c; }
.tag-orange { background: #fff0ea; color: var(--primary); }
.tag-blue { background: #dbeafe; color: #1d4ed8; }

/* ===== SEARCH ===== */
.search-bar {
  display: flex;
  align-items: center;
  background: white;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  gap: 8px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.search-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-family: var(--font);
  font-size: 14px;
  background: transparent;
}

/* ===== EMPTY ===== */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text2);
}

.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; font-weight: 600; }
.empty-sub { font-size: 13px; margin-top: 4px; }

/* ===== DESKTOP ===== */
@media (min-width: 768px) {
  .page-content { padding: 28px 24px 100px; }
  .kpi-grid { grid-template-columns: repeat(4, 1fr); }
  .modal-overlay { align-items: center; }
  .modal { border-radius: 24px; max-height: 80vh; }
}

/* ===== UTILS ===== */
.text-right { text-align: right; }
.text-green { color: var(--green); }
.text-red { color: var(--red); }
.mt-16 { margin-top: 16px; }
.loading { text-align: center; padding: 32px; color: var(--text2); }

/* divider */
.divider { height: 1px; background: var(--border); margin: 16px 0; }

</style>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="app-shell">
  <div class="top-bar">
    <div class="top-bar-left">
      <a href="/dashboard.html" style="text-decoration:none;font-size:22px;margin-right:4px;">←</a>
      <div class="top-bar-title">📋 Công Nợ</div>
    </div>
    <button class="btn btn-primary btn-sm" id="btnAdd">+ Ghi nợ</button>
  </div>

  <div class="page-content">
    <!-- Summary -->
    <div class="kpi-grid" style="grid-template-columns:1fr 1fr;margin-bottom:16px;">
      <div class="kpi-card">
        <div class="kpi-icon">💸</div>
        <div class="kpi-label">Chưa thu</div>
        <div class="kpi-val text-red" id="totalDebt">...</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">✅</div>
        <div class="kpi-label">Đã thu tháng này</div>
        <div class="kpi-val text-green" id="totalPaid">...</div>
      </div>
    </div>

    <!-- Filter -->
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="tag tag-orange" id="filterAll" onclick="setFilter('all')">Tất cả</button>
      <button class="tag tag-blue" id="filterDebt" onclick="setFilter('chua_thu')">Chưa thu</button>
      <button class="tag tag-blue" id="filterPaid" onclick="setFilter('da_thu')">Đã thu</button>
    </div>

    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Tìm tên khách..."/>
    </div>

    <div id="debtList"><div class="loading">Đang tải...</div></div>
  </div>

  <button class="fab" id="fabAdd">+</button>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item" href="/dashboard.html"><span class="nav-icon">🏠</span><span class="nav-label">Tổng quan</span></a>
    <a class="nav-item" href="/sales.html"><span class="nav-icon">🛒</span><span class="nav-label">Bán hàng</span></a>
    <a class="nav-item" href="/inventory.html"><span class="nav-icon">📦</span><span class="nav-label">Kho hàng</span></a>
    <a class="nav-item active" href="/debt.html"><span class="nav-icon">📋</span><span class="nav-label">Công nợ</span></a>
    <a class="nav-item" href="/report.html"><span class="nav-icon">📊</span><span class="nav-label">Báo cáo</span></a>
  </nav>
</div>

<!-- MODAL GHI NỢ -->
<div class="modal-overlay" id="modalDebt">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Ghi nợ mới</div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="editId"/>
    <div class="field">
      <label>Tên khách hàng *</label>
      <input type="text" id="fName" placeholder="Họ tên khách..."/>
    </div>
    <div class="field">
      <label>Số tiền nợ (đ) *</label>
      <input type="number" id="fAmount" min="0" placeholder="0"/>
    </div>
    <div class="field">
      <label>Ngày ghi nợ</label>
      <input type="date" id="fDate"/>
    </div>
    <div class="field">
      <label>Ghi chú</label>
      <input type="text" id="fNote" placeholder="Mua gì, hẹn trả khi nào..."/>
    </div>
    <div class="field">
      <label>Trạng thái</label>
      <select id="fStatus">
        <option value="chua_thu">⏳ Chưa thu</option>
        <option value="da_thu">✅ Đã thu</option>
      </select>
    </div>
    <button class="btn btn-primary btn-full mt-16" id="btnSave">💾 Lưu</button>
    <button class="btn btn-success btn-full" id="btnMarkPaid" style="display:none;margin-top:10px;">✅ Đánh dấu đã thu</button>
    <button class="btn btn-danger btn-full" id="btnDelete" style="display:none;margin-top:10px;">🗑️ Xóa</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
              const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCRgJ9qLFiwY-v6K9dvdgIZXnzPeIiwfDY",
      authDomain: "quan-ao-manager.firebaseapp.com",
      projectId: "quan-ao-manager",
      storageBucket: "quan-ao-manager.firebasestorage.app",
      messagingSenderId: "890329830315",
      appId: "1:890329830315:web:bae03b04ef3af43cd6f8ee"
    };
  // ===== SHARED UTILITIES =====

function fmt(num) {
  if (!num && num !== 0) return "0";
  return Number(num).toLocaleString("vi-VN") + "đ";
}

function fmtNum(num) {
  return Number(num || 0).toLocaleString("vi-VN");
}

function today() {
  return new Date().toISOString().split("T")[0];
}

function fmtDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return d.toLocaleDateString("vi-VN");
}

function fmtDateTime(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("vi-VN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

function showModal(id) {
  document.getElementById(id).classList.add("open");
}

function hideModal(id) {
  document.getElementById(id).classList.remove("open");
}

function toast(msg, type = "success") {
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = `
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:${type === "success" ? "#22c55e" : "#ef4444"};
    color:white; padding:10px 20px; border-radius:20px;
    font-family:'Be Vietnam Pro',sans-serif; font-size:14px; font-weight:600;
    z-index:9999; box-shadow:0 4px 16px rgba(0,0,0,.2);
    animation: fadeInUp .3s ease;
  `;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// nav highlight
function setActiveNav(page) {
  document.querySelectorAll(".nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.page === page);
  });
}


  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);
  onAuthStateChanged(auth, u => { if (!u) window.location.href = "../index.html"; });

  let allDebts = [];
  let currentFilter = "all";

  async function loadDebts() {
    const snap = await getDocs(query(collection(db,"debts"), orderBy("createdAt","desc")));
    allDebts = [];
    snap.forEach(d => allDebts.push({ id: d.id, ...d.data() }));

    const totalDebt = allDebts.filter(d => d.status === "chua_thu").reduce((s, d) => s + d.amount, 0);
    document.getElementById("totalDebt").textContent = fmt(totalDebt);

    const now = new Date();
    const monthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    const totalPaid = allDebts.filter(d => d.status === "da_thu" && d.date?.startsWith(monthStr)).reduce((s, d) => s + d.amount, 0);
    document.getElementById("totalPaid").textContent = fmt(totalPaid);

    renderList();
  }

  window.setFilter = function(f) {
    currentFilter = f;
    ["filterAll","filterDebt","filterPaid"].forEach(id => document.getElementById(id).className = "tag tag-blue");
    document.getElementById(f === "all" ? "filterAll" : f === "chua_thu" ? "filterDebt" : "filterPaid").className = "tag tag-orange";
    renderList();
  };

  function renderList() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    let items = allDebts.filter(d => 
      d.customerName?.toLowerCase().includes(search) &&
      (currentFilter === "all" || d.status === currentFilter)
    );

    const el = document.getElementById("debtList");
    if (!items.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Không có công nợ</div></div>`;
      return;
    }

    el.innerHTML = items.map(d => `
      <div class="list-item" onclick="openEdit('${d.id}')">
        <div class="list-icon ${d.status === "da_thu" ? "bg-green" : "bg-red"}">👤</div>
        <div class="list-info">
          <div class="list-name">${d.customerName}</div>
          <div class="list-sub">${fmtDate(d.date)} ${d.note ? "• " + d.note : ""}</div>
        </div>
        <div class="list-right">
          <div class="list-amount ${d.status === "da_thu" ? "text-green" : "text-red"}">${fmt(d.amount)}</div>
          <div class="list-date"><span class="tag ${d.status === "da_thu" ? "tag-green" : "tag-red"}">${d.status === "da_thu" ? "Đã thu" : "Chưa thu"}</span></div>
        </div>
      </div>
    `).join("");
  }

  document.getElementById("searchInput").addEventListener("input", renderList);

  window.closeModal = function() { document.getElementById("modalDebt").classList.remove("open"); };
  document.getElementById("modalDebt").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });

  function openAdd() {
    document.getElementById("modalTitle").textContent = "Ghi nợ mới";
    document.getElementById("editId").value = "";
    document.getElementById("fName").value = "";
    document.getElementById("fAmount").value = "";
    document.getElementById("fDate").value = today();
    document.getElementById("fNote").value = "";
    document.getElementById("fStatus").value = "chua_thu";
    document.getElementById("btnDelete").style.display = "none";
    document.getElementById("btnMarkPaid").style.display = "none";
    document.getElementById("modalDebt").classList.add("open");
  }

  window.openEdit = function(id) {
    const d = allDebts.find(x => x.id === id);
    if (!d) return;
    document.getElementById("modalTitle").textContent = "Chi tiết công nợ";
    document.getElementById("editId").value = id;
    document.getElementById("fName").value = d.customerName || "";
    document.getElementById("fAmount").value = d.amount || "";
    document.getElementById("fDate").value = d.date || today();
    document.getElementById("fNote").value = d.note || "";
    document.getElementById("fStatus").value = d.status || "chua_thu";
    document.getElementById("btnDelete").style.display = "block";
    document.getElementById("btnMarkPaid").style.display = d.status === "chua_thu" ? "block" : "none";
    document.getElementById("modalDebt").classList.add("open");
  };

  document.getElementById("btnAdd").addEventListener("click", openAdd);
  document.getElementById("fabAdd").addEventListener("click", openAdd);

  document.getElementById("btnSave").addEventListener("click", async () => {
    const name = document.getElementById("fName").value.trim();
    const amount = parseInt(document.getElementById("fAmount").value) || 0;
    if (!name || !amount) { toast("Vui lòng nhập đủ thông tin!", "error"); return; }
    const data = {
      customerName: name,
      amount,
      date: document.getElementById("fDate").value,
      note: document.getElementById("fNote").value.trim(),
      status: document.getElementById("fStatus").value,
      updatedAt: serverTimestamp()
    };
    const editId = document.getElementById("editId").value;
    try {
      if (editId) { await updateDoc(doc(db,"debts",editId), data); toast("Đã cập nhật!"); }
      else { data.createdAt = serverTimestamp(); await addDoc(collection(db,"debts"), data); toast("Đã ghi nợ!"); }
      closeModal(); loadDebts();
    } catch(e) { toast("Lỗi: " + e.message, "error"); }
  });

  document.getElementById("btnMarkPaid").addEventListener("click", async () => {
    const editId = document.getElementById("editId").value;
    await updateDoc(doc(db,"debts",editId), { status: "da_thu", updatedAt: serverTimestamp() });
    toast("✅ Đã đánh dấu thu xong!");
    closeModal(); loadDebts();
  });

  document.getElementById("btnDelete").addEventListener("click", async () => {
    if (!confirm("Xóa khoản nợ này?")) return;
    await deleteDoc(doc(db,"debts",document.getElementById("editId").value));
    toast("Đã xóa!"); closeModal(); loadDebts();
  });

  loadDebts();
</script>
</body>
</html>
