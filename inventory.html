<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Kho Hàng</title>
  <style>
/* ===== VARIABLES ===== */
:root {
  --primary: #e85d26;
  --primary-dark: #c44a1a;
  --primary-light: #fff0ea;
  --accent: #ffb347;
  --green: #22c55e;
  --red: #ef4444;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --bg: #faf8f5;
  --card: #ffffff;
  --text: #1a1410;
  --text2: #6b5e52;
  --border: #e8e0d8;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --font: 'Be Vietnam Pro', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
}

/* ===== LOGIN ===== */
.login-body { background: linear-gradient(135deg, #e85d26 0%, #ff8c42 50%, #ffb347 100%); }

.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-card {
  background: white;
  border-radius: 24px;
  padding: 40px 32px;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
  text-align: center;
}

.shop-logo { font-size: 56px; margin-bottom: 12px; }

.shop-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 6px;
}

.shop-title span { color: var(--primary); }
.shop-sub { color: var(--text2); font-size: 14px; margin-bottom: 32px; }

.form-group { text-align: left; margin-bottom: 16px; }

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 15px;
  transition: border-color .2s;
  outline: none;
}

.form-group input:focus { border-color: var(--primary); }

.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: background .2s, transform .1s;
}

.btn-login:hover { background: var(--primary-dark); }
.btn-login:active { transform: scale(.98); }

.err-msg { color: var(--red); font-size: 13px; margin-top: 10px; }

/* ===== LAYOUT ===== */
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }

.top-bar {
  background: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
}

.top-bar-left { display: flex; align-items: center; gap: 10px; }

.top-bar-logo { font-size: 24px; }

.top-bar-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
}

.top-bar-title span { color: var(--primary); }

.btn-logout {
  padding: 8px 14px;
  background: var(--primary-light);
  color: var(--primary);
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.page-content {
  flex: 1;
  padding: 20px 16px 100px;
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: white;
  border-top: 1px solid var(--border);
  display: flex;
  box-shadow: 0 -4px 20px rgba(0,0,0,.08);
  z-index: 100;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 4px 14px;
  cursor: pointer;
  text-decoration: none;
  color: var(--text2);
  transition: color .2s;
  border: none;
  background: none;
  font-family: var(--font);
}

.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 22px; margin-bottom: 2px; }
.nav-label { font-size: 10px; font-weight: 600; }

/* ===== CARDS ===== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.card-value {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
}

.card-value.green { color: var(--green); }
.card-value.red { color: var(--red); }
.card-value.blue { color: var(--blue); }
.card-value.orange { color: var(--primary); }

/* ===== KPIS GRID ===== */
.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.kpi-card {
  background: white;
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.kpi-icon { font-size: 28px; margin-bottom: 8px; }
.kpi-label { font-size: 12px; color: var(--text2); font-weight: 500; margin-bottom: 4px; }
.kpi-val { font-size: 20px; font-weight: 800; }

/* ===== SECTION HEADER ===== */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.section-title {
  font-size: 16px;
  font-weight: 700;
}

/* ===== BUTTONS ===== */
.btn {
  padding: 12px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s, transform .1s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--green); color: white; }
.btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn-full { width: 100%; justify-content: center; }
.btn-danger { background: var(--red); color: white; }

/* ===== FLOATING ADD BUTTON ===== */
.fab {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  border: none;
  font-size: 26px;
  box-shadow: 0 4px 20px rgba(232,93,38,.5);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s;
  z-index: 90;
}

.fab:hover { transform: scale(1.08); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}

.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: white;
  border-radius: 24px 24px 0 0;
  padding: 28px 20px 40px;
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.25,.46,.45,.94);
}

.modal-overlay.open .modal { transform: translateY(0); }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.modal-title { font-size: 18px; font-weight: 800; }

.btn-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg);
  border: none;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== FORM ===== */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }

.field input, .field select, .field textarea {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 15px;
  background: white;
  outline: none;
  transition: border-color .2s;
}

.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ===== LIST ITEMS ===== */
.list-item {
  background: white;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
}

.list-item:active { transform: scale(.98); }

.list-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.bg-orange { background: #fff0ea; }
.bg-green { background: #f0fdf4; }
.bg-blue { background: #eff6ff; }
.bg-red { background: #fef2f2; }
.bg-purple { background: #f5f3ff; }

.list-info { flex: 1; min-width: 0; }
.list-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

.list-right { text-align: right; flex-shrink: 0; }
.list-amount { font-weight: 700; font-size: 15px; }
.list-date { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* ===== TAGS ===== */
.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}

.tag-green { background: #dcfce7; color: #15803d; }
.tag-red { background: #fee2e2; color: #b91c1c; }
.tag-orange { background: #fff0ea; color: var(--primary); }
.tag-blue { background: #dbeafe; color: #1d4ed8; }

/* ===== SEARCH ===== */
.search-bar {
  display: flex;
  align-items: center;
  background: white;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  gap: 8px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.search-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-family: var(--font);
  font-size: 14px;
  background: transparent;
}

/* ===== EMPTY ===== */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text2);
}

.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; font-weight: 600; }
.empty-sub { font-size: 13px; margin-top: 4px; }

/* ===== DESKTOP ===== */
@media (min-width: 768px) {
  .page-content { padding: 28px 24px 100px; }
  .kpi-grid { grid-template-columns: repeat(4, 1fr); }
  .modal-overlay { align-items: center; }
  .modal { border-radius: 24px; max-height: 80vh; }
}

/* ===== UTILS ===== */
.text-right { text-align: right; }
.text-green { color: var(--green); }
.text-red { color: var(--red); }
.mt-16 { margin-top: 16px; }
.loading { text-align: center; padding: 32px; color: var(--text2); }

/* divider */
.divider { height: 1px; background: var(--border); margin: 16px 0; }

</style>

</head>
<body>
<div class="app-shell">
  <div class="top-bar">
    <div class="top-bar-left">
      <a href="/dashboard.html" style="text-decoration:none;font-size:22px;margin-right:4px;">←</a>
      <div class="top-bar-title">📦 Kho Hàng</div>
    </div>
    <button class="btn btn-primary btn-sm" id="btnAdd">+ Thêm hàng</button>
  </div>

  <div class="page-content">
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Tìm tên hàng..."/>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;" id="catFilter">
      <button class="tag tag-orange" data-cat="" onclick="filterCat(this,'')">Tất cả</button>
    </div>

    <div id="itemList"><div class="loading">Đang tải...</div></div>
  </div>

  <button class="fab" id="fabAdd">+</button>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item" href="/dashboard.html"><span class="nav-icon">🏠</span><span class="nav-label">Tổng quan</span></a>
    <a class="nav-item" href="/sales.html"><span class="nav-icon">🛒</span><span class="nav-label">Bán hàng</span></a>
    <a class="nav-item active" href="/inventory.html"><span class="nav-icon">📦</span><span class="nav-label">Kho hàng</span></a>
    <a class="nav-item" href="/debt.html"><span class="nav-icon">📋</span><span class="nav-label">Công nợ</span></a>
    <a class="nav-item" href="/report.html"><span class="nav-icon">📊</span><span class="nav-label">Báo cáo</span></a>
  </nav>
</div>

<!-- MODAL THÊM / SỬA HÀNG -->
<div class="modal-overlay" id="modalItem">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Thêm hàng mới</div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="editId"/>

    <!-- BƯỚC 1: QUÉT MÃ VẠCH -->
    <div id="step1">
      <div style="text-align:center;padding:8px 0 16px;">
        <div style="font-size:13px;color:var(--text2);margin-bottom:12px;">Quét mã vạch trên tag sản phẩm</div>
        <button class="btn btn-primary" style="font-size:15px;padding:14px 28px;" onclick="startScan()">📷 Quét mã vạch</button>
        <div style="margin:12px 0;color:var(--text2);font-size:13px;">— hoặc —</div>
        <button class="btn btn-outline" style="font-size:14px;" onclick="skipScan()">Nhập tay không cần quét</button>
      </div>
      <div id="scannerWrap" style="display:none;margin-bottom:16px;">
        <div style="position:relative;border-radius:12px;overflow:hidden;background:#000;">
          <video id="scanVideo" style="width:100%;max-height:240px;object-fit:cover;" autoplay playsinline></video>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
            <div style="width:70%;height:2px;background:rgba(232,93,38,.8);box-shadow:0 0 8px #e85d26;"></div>
          </div>
          <canvas id="scanCanvas" style="display:none;"></canvas>
        </div>
        <div style="text-align:center;margin-top:8px;font-size:13px;color:var(--text2);" id="scanStatus">Đưa mã vạch vào khung đỏ...</div>
        <button class="btn btn-outline btn-full" style="margin-top:8px;" onclick="stopScan();skipScan()">Bỏ qua, nhập tay</button>
      </div>
    </div>

    <!-- BƯỚC 2: CHỤP ẢNH -->
    <div id="step2" style="display:none;">
      <div style="text-align:center;padding:8px 0 16px;">
        <div style="font-size:14px;font-weight:700;margin-bottom:4px;">📷 Chụp ảnh sản phẩm</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:12px;">Mã: <strong id="scannedCode"></strong></div>
        <div id="photoPreview" style="display:none;margin-bottom:12px;">
          <img id="photoImg" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px;" src=""/>
        </div>
        <div id="cameraWrap" style="border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px;">
          <video id="photoVideo" style="width:100%;max-height:220px;object-fit:cover;" autoplay playsinline></video>
        </div>
        <canvas id="photoCanvas" style="display:none;"></canvas>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-primary btn-full" onclick="capturePhoto()">📸 Chụp ảnh</button>
          <button class="btn btn-outline" onclick="skipPhoto()">Bỏ qua</button>
        </div>
      </div>
    </div>

    <!-- BƯỚC 3: NHẬP THÔNG TIN -->
    <div id="step3" style="display:none;">
      <div id="step3Photo" style="display:none;margin-bottom:12px;text-align:center;">
        <img id="step3Img" style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--border);" src=""/>
        <button onclick="retakePhoto()" style="display:block;margin:4px auto 0;font-size:11px;color:var(--primary);background:none;border:none;cursor:pointer;">🔄 Chụp lại</button>
      </div>
      <div style="background:var(--primary-light);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--primary);font-weight:600;" id="barcodeInfo">
        🏷️ Mã: <span id="barcodeDisplay"></span>
      </div>
      <div class="field">
        <label>Tên sản phẩm *</label>
        <input type="text" id="fName" placeholder="Ví dụ: Áo thun nữ size M"/>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Danh mục</label>
          <input type="text" id="fCategory" placeholder="Áo, Quần, Váy..."/>
        </div>
        <div class="field">
          <label>Số lượng</label>
          <input type="number" id="fQty" min="0" placeholder="0"/>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Giá nhập (đ)</label>
          <input type="number" id="fCostPrice" min="0" placeholder="0"/>
        </div>
        <div class="field">
          <label>Giá bán (đ) *</label>
          <input type="number" id="fSellPrice" min="0" placeholder="0"/>
        </div>
      </div>
      <div class="field">
        <label>Ghi chú</label>
        <input type="text" id="fNote" placeholder="Màu sắc, size..."/>
      </div>
      <button class="btn btn-primary btn-full mt-16" id="btnSave">💾 Lưu</button>
      <button class="btn btn-danger btn-full" id="btnDelete" style="display:none;margin-top:10px;">🗑️ Xóa sản phẩm này</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, where, orderBy, limit, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCRgJ9qLFiwY-v6K9dvdgIZXnzPeIiwfDY",
    authDomain: "quan-ao-manager.firebaseapp.com",
    projectId: "quan-ao-manager",
    storageBucket: "quan-ao-manager.firebasestorage.app",
    messagingSenderId: "890329830315",
    appId: "1:890329830315:web:bae03b04ef3af43cd6f8ee"
  };

  function fmt(num) {
    if (!num && num !== 0) return "0";
    return Number(num).toLocaleString("vi-VN") + "đ";
  }
  function fmtNum(num) { return Number(num || 0).toLocaleString("vi-VN"); }
  function today() { return new Date().toISOString().split("T")[0]; }
  function fmtDate(dateStr) {
    if (!dateStr) return "";
    return new Date(dateStr).toLocaleDateString("vi-VN");
  }
  function fmtDateTime(ts) {
    if (!ts) return "";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString("vi-VN", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }
  function toast(msg, type="success") {
    const el = document.createElement("div");
    el.textContent = msg;
    el.style.cssText = `position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:${type==="success"?"#22c55e":"#ef4444"};color:white;padding:10px 20px;border-radius:20px;font-family:'Be Vietnam Pro',sans-serif;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
  function showModal(id) { document.getElementById(id).classList.add("open"); }
  function hideModal(id) { document.getElementById(id).classList.remove("open"); }


  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, u => { if (!u) window.location.href = "../index.html"; });

  let allItems = [];
  let currentCat = "";

  window.openLightbox = function(src) {
    const lb = document.getElementById("lightbox");
    document.getElementById("lightboxImg").src = src;
    lb.style.display = "flex";
  };

  async function loadItems() {
    const snap = await getDocs(query(collection(db,"inventory"), orderBy("name")));
    allItems = [];
    const cats = new Set();
    snap.forEach(d => { allItems.push({ id: d.id, ...d.data() }); if (d.data().category) cats.add(d.data().category); });
    
    // Build category filter
    const catEl = document.getElementById("catFilter");
    catEl.innerHTML = `<button class="tag ${currentCat === "" ? "tag-orange" : "tag-blue"}" onclick="filterCat(this,'')">Tất cả</button>`;
    cats.forEach(c => {
      catEl.innerHTML += `<button class="tag tag-blue" onclick="filterCat(this,'${c}')">${c}</button>`;
    });
    
    renderList();
  }

  window.filterCat = function(el, cat) {
    currentCat = cat;
    document.querySelectorAll("#catFilter .tag").forEach(b => b.className = "tag tag-blue");
    el.className = "tag tag-orange";
    renderList();
  };

  function renderList() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    let items = allItems.filter(p => 
      p.name.toLowerCase().includes(search) &&
      (currentCat === "" || p.category === currentCat)
    );

    const el = document.getElementById("itemList");
    if (!items.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">Không có sản phẩm nào</div><div class="empty-sub">Nhấn + để thêm hàng mới</div></div>`;
      return;
    }

    el.innerHTML = items.map(p => `
      <div class="list-item" onclick="openEdit('${p.id}')">
        <div class="list-icon" style="overflow:hidden;${p.photo ? "" : p.quantity <= 0 ? "background:#fef2f2;" : p.quantity <= 5 ? "background:#fff0ea;" : "background:#f0fdf4;"}">
          ${p.photo ? `<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;cursor:zoom-in;" onclick="event.stopPropagation();openLightbox('${p.photo}')">` : "👕"}
        </div>
        <div class="list-info">
          <div class="list-name">${p.name}</div>
          <div class="list-sub">${p.category || "—"} ${p.note ? "• " + p.note : ""}</div>
        </div>
        <div class="list-right">
          <div class="list-amount">${fmt(p.sellPrice)}</div>
          <div class="list-date">Còn: <strong class="${p.quantity <= 5 ? "text-red" : "text-green"}">${p.quantity}</strong></div>
        </div>
      </div>
    `).join("");
  }

  document.getElementById("searchInput").addEventListener("input", renderList);

  // Modal
  window.closeModal = function() {
    stopScan();
    stopPhotoCamera();
    document.getElementById("modalItem").classList.remove("open");
  };
  document.getElementById("modalItem").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });

  // === SCANNER & CAMERA STATE ===
  let scanStream = null;
  let photoStream = null;
  let scanInterval = null;
  let capturedPhoto = null;
  let capturedBarcode = "";

  function showStep(n) {
    ["step1","step2","step3"].forEach((id,i) => {
      document.getElementById(id).style.display = i+1 === n ? "block" : "none";
    });
  }

  function openAdd() {
    document.getElementById("modalTitle").textContent = "Thêm hàng mới";
    document.getElementById("editId").value = "";
    ["fName","fCategory","fNote"].forEach(id => document.getElementById(id).value = "");
    ["fQty","fCostPrice","fSellPrice"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("btnDelete").style.display = "none";
    capturedPhoto = null;
    capturedBarcode = "";
    document.getElementById("step3Photo").style.display = "none";
    document.getElementById("barcodeInfo").style.display = "none";
    showStep(1);
    document.getElementById("scannerWrap").style.display = "none";
    document.getElementById("modalItem").classList.add("open");
  }

  // BARCODE SCAN
  window.startScan = async function() {
    document.getElementById("scannerWrap").style.display = "block";
    document.getElementById("scanStatus").textContent = "Đang tải thư viện quét mã...";
    
    // Load ZXing library dynamically
    if (!window.ZXing) {
      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js";
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    try {
      const codeReader = new ZXing.BrowserMultiFormatReader();
      window._zxingReader = codeReader;
      document.getElementById("scanStatus").textContent = "Đưa mã vạch vào khung đỏ...";
      
      await codeReader.decodeFromConstraints(
        { video: { facingMode: "environment" } },
        "scanVideo",
        (result, err) => {
          if (result) {
            window._zxingReader.reset();
            onBarcodeFound(result.getText());
          }
        }
      );
    } catch(e) {
      document.getElementById("scanStatus").textContent = "Lỗi camera: " + e.message;
    }
  };

  window.stopScan = function() {
    if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
    if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
    if (window._zxingReader) { try { window._zxingReader.reset(); } catch(e){} window._zxingReader = null; }
  };

  function onBarcodeFound(code) {
    capturedBarcode = code;
    document.getElementById("scannedCode").textContent = code;
    // Go to photo step
    startPhotoCamera();
  }

  window.skipScan = function() {
    stopScan();
    capturedBarcode = "";
    startPhotoCamera();
  };

  // PHOTO CAMERA
  async function startPhotoCamera() {
    showStep(2);
    document.getElementById("photoPreview").style.display = "none";
    document.getElementById("cameraWrap").style.display = "block";
    try {
      photoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      document.getElementById("photoVideo").srcObject = photoStream;
    } catch(e) {
      // Camera not available, skip to step 3
      skipPhoto();
    }
  }

  function stopPhotoCamera() {
    if (photoStream) { photoStream.getTracks().forEach(t => t.stop()); photoStream = null; }
  }

  window.capturePhoto = function() {
    const video = document.getElementById("photoVideo");
    const canvas = document.getElementById("photoCanvas");
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext("2d").drawImage(video, 0, 0);
    // Compress to JPEG 60% max 800px
    const maxW = 800;
    const scale = Math.min(1, maxW / canvas.width);
    const c2 = document.createElement("canvas");
    c2.width = canvas.width * scale;
    c2.height = canvas.height * scale;
    c2.getContext("2d").drawImage(canvas, 0, 0, c2.width, c2.height);
    capturedPhoto = c2.toDataURL("image/jpeg", 0.6);
    stopPhotoCamera();
    goToStep3();
  };

  window.skipPhoto = function() {
    stopPhotoCamera();
    capturedPhoto = null;
    goToStep3();
  };

  window.retakePhoto = function() {
    capturedPhoto = null;
    startPhotoCamera();
  };

  function goToStep3() {
    showStep(3);
    if (capturedPhoto) {
      document.getElementById("step3Img").src = capturedPhoto;
      document.getElementById("step3Photo").style.display = "block";
    }
    if (capturedBarcode) {
      document.getElementById("barcodeDisplay").textContent = capturedBarcode;
      document.getElementById("barcodeInfo").style.display = "block";
      document.getElementById("fNote").value = capturedBarcode;
    } else {
      document.getElementById("barcodeInfo").style.display = "none";
    }
  }

  window.openEdit = function(id) {
    const p = allItems.find(x => x.id === id);
    if (!p) return;
    document.getElementById("modalTitle").textContent = "Sửa sản phẩm";
    document.getElementById("editId").value = id;
    document.getElementById("fName").value = p.name || "";
    document.getElementById("fCategory").value = p.category || "";
    document.getElementById("fQty").value = p.quantity || 0;
    document.getElementById("fCostPrice").value = p.costPrice || "";
    document.getElementById("fSellPrice").value = p.sellPrice || "";
    document.getElementById("fNote").value = p.note || "";
    document.getElementById("btnDelete").style.display = "block";
    capturedPhoto = p.photo || null;
    capturedBarcode = "";
    if (capturedPhoto) {
      document.getElementById("step3Img").src = capturedPhoto;
      document.getElementById("step3Photo").style.display = "block";
    } else {
      document.getElementById("step3Photo").style.display = "none";
    }
    document.getElementById("barcodeInfo").style.display = "none";
    showStep(3);
    document.getElementById("modalItem").classList.add("open");
  };

  document.getElementById("btnAdd").addEventListener("click", openAdd);
  document.getElementById("fabAdd").addEventListener("click", openAdd);

  document.getElementById("btnSave").addEventListener("click", async () => {
    const name = document.getElementById("fName").value.trim();
    const qty = parseInt(document.getElementById("fQty").value) || 0;
    const sellPrice = parseInt(document.getElementById("fSellPrice").value) || 0;
    if (!name || !sellPrice) { toast("Vui lòng nhập tên và giá bán!", "error"); return; }

    const data = {
      name,
      category: document.getElementById("fCategory").value.trim(),
      quantity: qty,
      costPrice: parseInt(document.getElementById("fCostPrice").value) || 0,
      sellPrice,
      note: document.getElementById("fNote").value.trim(),
      photo: capturedPhoto || null,
      barcode: capturedBarcode || "",
      updatedAt: serverTimestamp()
    };

    const editId = document.getElementById("editId").value;
    try {
      if (editId) {
        await updateDoc(doc(db,"inventory",editId), data);
        toast("Đã cập nhật!");
      } else {
        data.createdAt = serverTimestamp();
        await addDoc(collection(db,"inventory"), data);
        toast("Đã thêm hàng mới!");
      }
      closeModal();
      loadItems();
    } catch(e) { toast("Lỗi: " + e.message, "error"); }
  });

  document.getElementById("btnDelete").addEventListener("click", async () => {
    if (!confirm("Xóa sản phẩm này?")) return;
    const editId = document.getElementById("editId").value;
    await deleteDoc(doc(db,"inventory",editId));
    toast("Đã xóa!");
    closeModal();
    loadItems();
  });

  loadItems();
</script>

<div id="lightbox" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center;cursor:zoom-out;">
  <img id="lightboxImg" style="max-width:95%;max-height:95vh;border-radius:12px;object-fit:contain;" src=""/>
</div>
</body>
