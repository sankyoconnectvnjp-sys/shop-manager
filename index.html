<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Cửa Hàng Của Mẹ</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #e85d26 0%, #ff8c42 60%, #ffb347 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: white; border-radius: 28px; padding: 36px 28px 32px;
      width: 100%; max-width: 360px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .logo { font-size: 60px; margin-bottom: 10px; }
    h1 { font-size: 26px; font-weight: 800; color: #1a1410; }
    h1 span { color: #e85d26; }
    .sub { font-size: 14px; color: #888; margin: 6px 0 28px; }
    .pin-label { font-size: 13px; font-weight: 700; color: #555; margin-bottom: 14px; }
    .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 28px; }
    .dot {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2.5px solid #ddd; background: white; transition: all .2s;
    }
    .dot.filled { background: #e85d26; border-color: #e85d26; transform: scale(1.15); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .dot.shake { animation: shake .4s ease; }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .key {
      height: 64px; border-radius: 16px; border: none; background: #f5f5f5;
      font-family: 'Be Vietnam Pro', sans-serif; font-size: 22px; font-weight: 700;
      color: #1a1410; cursor: pointer; transition: background .15s, transform .1s;
      display: flex; align-items: center; justify-content: center;
    }
    .key:active { background: #ffe0d0; transform: scale(.93); }
    .key.zero { grid-column: 2; }
    .key.del { background: #fff0ea; color: #e85d26; font-size: 20px; }
    .key.empty { background: transparent; cursor: default; pointer-events: none; }
    .err { color: #ef4444; font-size: 13px; font-weight: 600; margin-top: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🛍️</div>
    <h1>Cửa Hàng <span>Của Mẹ</span></h1>
    <p class="sub">Nhập mã PIN để vào</p>
    <div class="pin-label">MÃ PIN</div>
    <div class="pin-dots">
      <div class="dot" id="d0"></div>
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>
    <div class="numpad">
      <button class="key" onclick="press('1')">1</button>
      <button class="key" onclick="press('2')">2</button>
      <button class="key" onclick="press('3')">3</button>
      <button class="key" onclick="press('4')">4</button>
      <button class="key" onclick="press('5')">5</button>
      <button class="key" onclick="press('6')">6</button>
      <button class="key" onclick="press('7')">7</button>
      <button class="key" onclick="press('8')">8</button>
      <button class="key" onclick="press('9')">9</button>
      <button class="key empty"></button>
      <button class="key zero" onclick="press('0')">0</button>
      <button class="key del" onclick="del()">⌫</button>
    </div>
    <div class="err" id="errMsg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCRgJ9qLFiwY-v6K9dvdgIZXnzPeIiwfDY",
      authDomain: "quan-ao-manager.firebaseapp.com",
      projectId: "quan-ao-manager",
      storageBucket: "quan-ao-manager.firebasestorage.app",
      messagingSenderId: "890329830315",
      appId: "1:890329830315:web:bae03b04ef3af43cd6f8ee"
    };

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      if (user) window.location.href = "dashboard.html";
    });

    const PIN_MAP = {
      "1234": ["me@quanao.com", "qm_secret_2024"]
    };

    let pin = "";

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById("d" + i).classList.toggle("filled", i < pin.length);
      }
    }

    window.press = function(num) {
      if (pin.length >= 4) return;
      pin += num;
      updateDots();
      if (pin.length === 4) setTimeout(tryLogin, 200);
    };

    window.del = function() {
      pin = pin.slice(0, -1);
      updateDots();
      document.getElementById("errMsg").textContent = "";
    };

    async function tryLogin() {
      const creds = PIN_MAP[pin];
      if (!creds) { showError(); return; }
      try {
        await signInWithEmailAndPassword(auth, creds[0], creds[1]);
      } catch(e) { showError(); }
    }

    function showError() {
      document.getElementById("errMsg").textContent = "Mã PIN không đúng, thử lại!";
      document.querySelectorAll(".dot").forEach(d => {
        d.classList.add("shake");
        setTimeout(() => d.classList.remove("shake"), 400);
      });
      pin = "";
      setTimeout(updateDots, 400);
    }

    document.addEventListener("keydown", e => {
      if (e.key >= "0" && e.key <= "9") window.press(e.key);
      if (e.key === "Backspace") window.del();
    });
  </script>
</body>
</html>
