<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Nhà Cung Cấp</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary:#e85d26;--primary-dark:#c44a1a;--primary-light:#fff0ea;
      --green:#22c55e;--red:#ef4444;--blue:#3b82f6;
      --bg:#faf8f5;--card:#ffffff;--text:#1a1410;--text2:#6b5e52;
      --border:#e8e0d8;--shadow:0 2px 12px rgba(0,0,0,.08);
      --radius:16px;--radius-sm:10px;--font:'Be Vietnam Pro',sans-serif;
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }
    .top-bar { background:white; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; box-shadow:0 1px 8px rgba(0,0,0,.06); }
    .top-bar-left { display:flex; align-items:center; gap:10px; }
    .top-bar-title { font-size:17px; font-weight:800; }
    .page-content { padding:20px 16px 100px; max-width:640px; margin:0 auto; }
    .btn { padding:12px 20px; border:none; border-radius:var(--radius-sm); font-family:var(--font); font-size:14px; font-weight:600; cursor:pointer; transition:opacity .2s,transform .1s; display:inline-flex; align-items:center; gap:6px; }
    .btn:active { transform:scale(.97); }
    .btn-primary { background:var(--primary); color:white; }
    .btn-danger { background:var(--red); color:white; }
    .btn-sm { padding:8px 14px; font-size:13px; }
    .btn-full { width:100%; justify-content:center; }
    .fab { position:fixed; bottom:80px; right:20px; width:56px; height:56px; border-radius:50%; background:var(--primary); color:white; border:none; font-size:26px; box-shadow:0 4px 20px rgba(232,93,38,.5); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:90; }
    .search-bar { display:flex; align-items:center; background:white; border-radius:var(--radius-sm); padding:10px 14px; gap:8px; box-shadow:var(--shadow); margin-bottom:16px; }
    .search-bar input { flex:1; border:none; outline:none; font-family:var(--font); font-size:14px; background:transparent; }
    .list-item { background:white; border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); cursor:pointer; transition:transform .15s; }
    .list-item:active { transform:scale(.98); }
    .list-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; background:#eff6ff; }
    .list-info { flex:1; min-width:0; }
    .list-name { font-weight:700; font-size:15px; }
    .list-sub { font-size:12px; color:var(--text2); margin-top:2px; }
    .empty-state { text-align:center; padding:48px 20px; color:var(--text2); }
    .empty-icon { font-size:48px; margin-bottom:12px; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s; }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal { background:white; border-radius:24px 24px 0 0; padding:28px 20px 40px; width:100%; max-width:640px; max-height:90vh; overflow-y:auto; transform:translateY(100%); transition:transform .3s cubic-bezier(.25,.46,.45,.94); }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
    .modal-title { font-size:18px; font-weight:800; }
    .btn-close { width:32px; height:32px; border-radius:50%; background:var(--bg); border:none; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:13px; font-weight:600; color:var(--text2); margin-bottom:6px; }
    .field input, .field textarea { width:100%; padding:12px 14px; border:2px solid var(--border); border-radius:var(--radius-sm); font-family:var(--font); font-size:15px; background:white; outline:none; transition:border-color .2s; }
    .field input:focus, .field textarea:focus { border-color:var(--primary); }
    .mt-16 { margin-top:16px; }
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid var(--border); display:flex; box-shadow:0 -4px 20px rgba(0,0,0,.08); z-index:100; }
    .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 4px 14px; cursor:pointer; text-decoration:none; color:#6b5e52; border:none; background:none; font-family:var(--font); }
    .nav-item.active { color:var(--primary); }
    .nav-icon { font-size:22px; margin-bottom:2px; }
    .nav-label { font-size:10px; font-weight:600; }
    .tag { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
    .tag-blue { background:#dbeafe; color:#1d4ed8; }
    .call-btn { width:36px; height:36px; border-radius:50%; background:#f0fdf4; border:none; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; flex-shrink:0; text-decoration:none; }
  </style>
</head>
<body>
<div style="display:flex;flex-direction:column;min-height:100vh;">
  <div class="top-bar">
    <div class="top-bar-left">
      <a href="/inventory.html" style="text-decoration:none;font-size:22px;margin-right:4px;">←</a>
      <div class="top-bar-title">🏪 Nhà Cung Cấp</div>
    </div>
    <button class="btn btn-primary btn-sm" id="btnAdd">+ Thêm</button>
  </div>

  <div class="page-content">
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Tìm tên, SĐT..."/>
    </div>
    <div id="supplierList"><div style="text-align:center;padding:32px;color:var(--text2);">Đang tải...</div></div>
  </div>

  <button class="fab" id="fabAdd">+</button>

  <nav class="bottom-nav">
    <a class="nav-item" href="/dashboard.html"><span class="nav-icon">🏠</span><span class="nav-label">Tổng quan</span></a>
    <a class="nav-item" href="/sales.html"><span class="nav-icon">🛒</span><span class="nav-label">Bán hàng</span></a>
    <a class="nav-item active" href="/inventory.html"><span class="nav-icon">📦</span><span class="nav-label">Kho hàng</span></a>
    <a class="nav-item" href="/debt.html"><span class="nav-icon">📋</span><span class="nav-label">Công nợ</span></a>
    <a class="nav-item" href="/report.html"><span class="nav-icon">📊</span><span class="nav-label">Báo cáo</span></a>
  </nav>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalSupplier">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Thêm nhà cung cấp</div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="editId"/>
    <div class="field">
      <label>Tên nhà cung cấp *</label>
      <input type="text" id="fName" placeholder="Chợ Tân Bình, Shop ABC..."/>
    </div>
    <div class="field">
      <label>Số điện thoại</label>
      <input type="tel" id="fPhone" placeholder="0901 234 567"/>
    </div>
    <div class="field">
      <label>Địa chỉ</label>
      <input type="text" id="fAddress" placeholder="Số nhà, đường, quận..."/>
    </div>
    <div class="field">
      <label>Mặt hàng chính</label>
      <input type="text" id="fGoods" placeholder="Áo thun, quần jean, váy..."/>
    </div>
    <div class="field">
      <label>Ghi chú</label>
      <textarea id="fNote" rows="2" placeholder="Ngày lấy hàng, điều khoản..."></textarea>
    </div>
    <button class="btn btn-primary btn-full mt-16" id="btnSave">💾 Lưu</button>
    <button class="btn btn-danger btn-full" id="btnDelete" style="display:none;margin-top:10px;">🗑️ Xóa</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCRgJ9qLFiwY-v6K9dvdgIZXnzPeIiwfDY",
    authDomain: "quan-ao-manager.firebaseapp.com",
    projectId: "quan-ao-manager",
    storageBucket: "quan-ao-manager.firebasestorage.app",
    messagingSenderId: "890329830315",
    appId: "1:890329830315:web:bae03b04ef3af43cd6f8ee"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);
  onAuthStateChanged(auth, u => { if (!u) window.location.href = "/"; });

  function toast(msg, type="success") {
    const el = document.createElement("div");
    el.textContent = msg;
    el.style.cssText = `position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:${type==="success"?"#22c55e":"#ef4444"};color:white;padding:10px 20px;border-radius:20px;font-family:'Be Vietnam Pro',sans-serif;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }

  let allSuppliers = [];

  async function loadSuppliers() {
    const snap = await getDocs(query(collection(db,"suppliers"), orderBy("name")));
    allSuppliers = [];
    snap.forEach(d => allSuppliers.push({ id: d.id, ...d.data() }));
    renderList();
  }

  function renderList() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const items = allSuppliers.filter(s =>
      s.name?.toLowerCase().includes(search) ||
      s.phone?.includes(search) ||
      s.address?.toLowerCase().includes(search)
    );

    const el = document.getElementById("supplierList");
    if (!items.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">🏪</div><div style="font-size:15px;font-weight:600;">Chưa có nhà cung cấp</div><div style="font-size:13px;margin-top:4px;">Nhấn + để thêm</div></div>`;
      return;
    }

    el.innerHTML = items.map(s => `
      <div class="list-item" onclick="openEdit('${s.id}')">
        <div class="list-icon">🏪</div>
        <div class="list-info">
          <div class="list-name">${s.name}</div>
          <div class="list-sub">${s.goods ? "📦 " + s.goods + " • " : ""}${s.address || ""}</div>
          ${s.phone ? `<div style="font-size:12px;color:var(--primary);font-weight:600;margin-top:2px;">📞 ${s.phone}</div>` : ""}
        </div>
        ${s.phone ? `<a href="tel:${s.phone}" class="call-btn" onclick="event.stopPropagation()">📞</a>` : ""}
      </div>
    `).join("");
  }

  document.getElementById("searchInput").addEventListener("input", renderList);

  function openAdd() {
    document.getElementById("modalTitle").textContent = "Thêm nhà cung cấp";
    document.getElementById("editId").value = "";
    ["fName","fPhone","fAddress","fGoods","fNote"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("btnDelete").style.display = "none";
    document.getElementById("modalSupplier").classList.add("open");
  }

  window.openEdit = function(id) {
    const s = allSuppliers.find(x => x.id === id);
    if (!s) return;
    document.getElementById("modalTitle").textContent = "Sửa nhà cung cấp";
    document.getElementById("editId").value = id;
    document.getElementById("fName").value = s.name || "";
    document.getElementById("fPhone").value = s.phone || "";
    document.getElementById("fAddress").value = s.address || "";
    document.getElementById("fGoods").value = s.goods || "";
    document.getElementById("fNote").value = s.note || "";
    document.getElementById("btnDelete").style.display = "block";
    document.getElementById("modalSupplier").classList.add("open");
  };

  window.closeModal = function() { document.getElementById("modalSupplier").classList.remove("open"); };
  document.getElementById("modalSupplier").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });

  document.getElementById("btnAdd").addEventListener("click", openAdd);
  document.getElementById("fabAdd").addEventListener("click", openAdd);

  document.getElementById("btnSave").addEventListener("click", async () => {
    const name = document.getElementById("fName").value.trim();
    if (!name) { toast("Vui lòng nhập tên!", "error"); return; }
    const data = {
      name,
      phone: document.getElementById("fPhone").value.trim(),
      address: document.getElementById("fAddress").value.trim(),
      goods: document.getElementById("fGoods").value.trim(),
      note: document.getElementById("fNote").value.trim(),
      updatedAt: serverTimestamp()
    };
    const editId = document.getElementById("editId").value;
    try {
      if (editId) { await updateDoc(doc(db,"suppliers",editId), data); toast("Đã cập nhật!"); }
      else { data.createdAt = serverTimestamp(); await addDoc(collection(db,"suppliers"), data); toast("Đã thêm!"); }
      closeModal(); loadSuppliers();
    } catch(e) { toast("Lỗi: " + e.message, "error"); }
  });

  document.getElementById("btnDelete").addEventListener("click", async () => {
    if (!confirm("Xóa nhà cung cấp này?")) return;
    await deleteDoc(doc(db,"suppliers", document.getElementById("editId").value));
    toast("Đã xóa!"); closeModal(); loadSuppliers();
  });

  loadSuppliers();
</script>
</body>
</html>
